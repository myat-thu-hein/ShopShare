<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Pro Badminton Racket">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3de"/><stop offset="1" stop-color="#ff8bb6"/></linearGradient>
    <style>
      .p{fill:#e11d48;stroke:#a5000c;stroke-width:8;stroke-linejoin:round}
      .p .d{fill:#a5000c} .p .s{fill:#ff4f7a;stroke:#a5000c}
      .p .l{fill:none;stroke:#a5000c;stroke-width:10;stroke-linecap:round}
      .p .t{fill:none;stroke:#e11d48;stroke-width:42;stroke-linecap:round}
    </style>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="660" rx="260" ry="28" fill="#000" opacity="0.08"/>
  <g class="p"><rect x="250" y="380" width="300" height="40" rx="18" class="d"/>
    <rect x="170" y="300" width="80" height="200" rx="18"/><rect x="550" y="300" width="80" height="200" rx="18"/>
    <rect x="130" y="330" width="40" height="140" rx="12"/><rect x="630" y="330" width="40" height="140" rx="12"/></g>
</svg>